
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIBOOK STUDIO - Professional Manuscript Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F5F3;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
            overflow: hidden;
        }
        
        /* Cấu hình Editor chuẩn dàn trang */
        .tiptap {
            outline: none !important;
            min-height: 297mm;
        }
        .tiptap p {
            margin-bottom: 1em;
            text-align: justify;
            line-height: 1.8;
            word-break: break-word; /* Tự động xuống dòng */
            overflow-wrap: break-word;
        }
        .tiptap h1 { font-size: 2.8em; margin-bottom: 1.2em; text-align: center; font-weight: 800; page-break-after: avoid; }
        .tiptap h2 { font-size: 2em; margin-top: 2em; margin-bottom: 1em; font-weight: 700; page-break-after: avoid; }
        .tiptap h3 { font-size: 1.5em; margin-top: 1.5em; margin-bottom: 0.8em; font-weight: 600; page-break-after: avoid; }
        .tiptap ul, .tiptap ol { margin-left: 1.5em; margin-bottom: 1.2em; }
        .tiptap li { margin-bottom: 0.5em; text-align: justify; }

        /* Hiệu ứng trang giấy nối tiếp (Continuous Pages) */
        .page-scroll-container {
            background: white;
            box-shadow: 0 0 100px rgba(0,0,0,0.05);
            margin: 0 auto;
            position: relative;
            width: 210mm;
            min-height: 297mm;
            height: auto;
            /* Tạo đường kẻ mờ phân trang tự động mỗi 297mm */
            background-image: linear-gradient(to bottom, transparent calc(297mm - 1px), #f0f0f0 calc(297mm - 1px), #f0f0f0 297mm);
            background-size: 100% 297mm;
            padding: 30mm 25mm; /* Lề chuẩn sách */
        }

        /* Thước đo trang bên lề */
        .page-scroll-container::before {
            content: "PAGE LIMIT";
            position: absolute;
            left: -80px;
            top: 297mm;
            transform: translateY(-100%) rotate(-90deg);
            font-size: 8px;
            font-weight: 900;
            color: #ccc;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; overflow: visible !important; }
            .page-scroll-container {
                box-shadow: none !important;
                margin: 0 !important;
                width: 100% !important;
                background-image: none !important;
                padding: 0 !important;
            }
            .tiptap {
                min-height: auto !important;
            }
            h1, h2, h3 { break-after: avoid; }
            p { break-inside: auto; }
        }

        .font-serif-book { font-family: 'EB Garamond', serif; }
        .arch-grid {
            background-image: radial-gradient(#E5E5E5 0.7px, transparent 0.7px);
            background-size: 40px 40px;
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D1D1D1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #000; }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
    "@tiptap/extension-placeholder": "https://esm.sh/@tiptap/extension-placeholder@^3.19.0",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@^3.19.0",
    "@tiptap/react": "https://esm.sh/@tiptap/react@^3.19.0",
    "@tiptap/extension-highlight": "https://esm.sh/@tiptap/extension-highlight@^3.19.0",
    "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@^3.19.0",
    "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@^3.19.0",
    "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@^3.19.0",
    "@tiptap/extension-font-family": "https://esm.sh/@tiptap/extension-font-family@^3.19.0",
    "@tiptap/core": "https://esm.sh/@tiptap/core@^3.19.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
